<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student API</title>

    <style>

        :root {
            --bg: #141b22;
            --panel: #1b252f;
            --panel-2: #243240;
            --border: #34495c;
            --text: #cfe9d6;
            --muted: #7d9a8a;
            --green: #4af626;
            --cyan: #4fd8ff;
            --amber: #ffcb47;
            --red: #ff5f56;
            --yellow: #ffbd2e;
            --dot-green: #27c93f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Fira Code", "Cascadia Code", "JetBrains Mono",
                         Consolas, "Courier New", monospace;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(74, 246, 38, 0.025) 0,
                    rgba(74, 246, 38, 0.025) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 16px;
            min-height: 100vh;
            font-size: 15px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ---------- Terminal window ---------- */

        .window {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 28px;
            overflow: hidden;
            box-shadow: 0 0 24px rgba(74, 246, 38, 0.08),
                        0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--panel-2);
            border-bottom: 1px solid var(--border);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.r { background: var(--red); }
        .dot.y { background: var(--yellow); }
        .dot.g { background: var(--dot-green); }

        .title {
            margin-left: 10px;
            font-size: 13px;
            color: var(--muted);
        }

        a.admin-link {
            margin-left: auto;
            padding: 4px 10px;
            border: 1px solid var(--amber);
            border-radius: 4px;
            color: var(--amber);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.15s, color 0.15s, box-shadow 0.15s;
        }

        a.admin-link:hover {
            background: var(--amber);
            color: #1a1400;
            box-shadow: 0 0 14px rgba(255, 203, 71, 0.5);
        }

        .body {
            padding: 22px;
        }

        /* ---------- Text ---------- */

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--green);
            margin: 0 0 6px;
            text-shadow: 0 0 10px rgba(74, 246, 38, 0.45);
        }

        h1::after {
            content: "_";
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .sub {
            color: var(--muted);
            margin: 0 0 26px;
        }

        .prompt {
            color: var(--cyan);
            margin: 0 0 16px;
            font-weight: 600;
        }

        .prompt .user {
            color: var(--green);
        }

        .prompt .cmd {
            color: var(--amber);
        }

        /* ---------- Inputs ---------- */

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .field {
            flex: 1;
            min-width: 150px;
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0 10px;
        }

        .field:focus-within {
            border-color: var(--green);
            box-shadow: 0 0 10px rgba(74, 246, 38, 0.25);
        }

        .field span {
            color: var(--green);
            font-weight: 700;
            margin-right: 8px;
        }

        input {
            flex: 1;
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            caret-color: var(--green);
        }

        input::placeholder {
            color: var(--muted);
        }

        /* ---------- Buttons ---------- */

        button {
            padding: 11px 18px;
            background: transparent;
            border: 1px solid var(--green);
            border-radius: 4px;
            color: var(--green);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, box-shadow 0.15s;
        }

        button::before { content: "[ "; }
        button::after  { content: " ]"; }

        button:hover {
            background: var(--green);
            color: #0b1410;
            box-shadow: 0 0 14px rgba(74, 246, 38, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card-header .prompt {
            margin: 0;
        }

        /* ---------- Table ---------- */

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--cyan);
            padding: 10px 12px;
            border-bottom: 1px dashed var(--border);
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px dashed var(--border);
        }

        td:first-child {
            color: var(--amber);
        }

        td:nth-child(2) {
            color: #ffffff;
        }

        td:last-child {
            color: var(--green);
        }

        tbody tr:hover {
            background: var(--panel-2);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody:empty::after {
            content: "-- no data loaded. run load_students --";
            display: block;
            padding: 16px 12px;
            color: var(--muted);
        }

    </style>

</head>


<body>

    <div class="container">


        <!-- INSERT -->

        <div class="window">

            <div class="titlebar">
                <span class="dot r"></span>
                <span class="dot y"></span>
                <span class="dot g"></span>
                <span class="title">user@student-db: ~/insert</span>
                <a class="admin-link" href="/admin">[ Admin ]</a>
            </div>

            <div class="body">

                <h1>Student Management</h1>
                <p class="sub">// node server.js :: listening on port 3000</p>

                <p class="prompt">
                    <span class="user">root@student-db</span>:~$
                    <span class="cmd">add_student</span> --new
                </p>

                <div class="form-row">

                    <label class="field">
                        <span>&gt;</span>
                        <input
                            type="text"
                            id="name"
                            placeholder="name"
                        >
                    </label>

                    <label class="field">
                        <span>&gt;</span>
                        <input
                            type="text"
                            id="course"
                            placeholder="course"
                        >
                    </label>

                    <label class="field">
                        <span>&gt;</span>
                        <input
                            type="number"
                            id="yearLevel"
                            placeholder="year_level"
                        >
                    </label>

                    <button onclick="addStudent()">
                        Add Student
                    </button>

                </div>

            </div>

        </div>


        <!-- RETRIEVE -->

        <div class="window">

            <div class="titlebar">
                <span class="dot r"></span>
                <span class="dot y"></span>
                <span class="dot g"></span>
                <span class="title">user@student-db: ~/students</span>
            </div>

            <div class="body">

                <div class="card-header">

                    <p class="prompt">
                        <span class="user">root@student-db</span>:~$
                        <span class="cmd">SELECT</span> * FROM students;
                    </p>

                    <button onclick="loadStudents()">
                        Load Students
                    </button>

                </div>

                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Year Level</th>
                            </tr>

                        </thead>

                        <tbody id="studentTable"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <script>

        // RETRIEVE
        async function loadStudents() {
            const res = await fetch("/api/students");
            const students = await res.json();

            const table = document.getElementById("studentTable");
            table.innerHTML = "";

            students.forEach((s) => {
                table.innerHTML += `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.name}</td>
                        <td>${s.course}</td>
                        <td>${s.year_level}</td>
                    </tr>
                `;
            });
        }


        // INSERT
        async function addStudent() {
            const name = document.getElementById("name").value;
            const course = document.getElementById("course").value;
            const yearLevel = document.getElementById("yearLevel").value;

            await fetch("/api/students", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, course, year_level: yearLevel })
            });

            document.getElementById("name").value = "";
            document.getElementById("course").value = "";
            document.getElementById("yearLevel").value = "";

            loadStudents();
        }

    </script>

</body>

</html>
